<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oh Hell — Scorepad</title>
<!-- Tab icon, inline so there is no second request and no favicon.ico
     404 on every load.  Gold card behind, cream card face up, rouge heart. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'> <rect width='64' height='64' rx='14' fill='%230E1218'/> <g transform='rotate(-17 32 54)'><rect x='13' y='11' width='28' height='41' rx='5' fill='%23C9A227'/></g> <g transform='rotate(8 32 54)'><rect x='22' y='11' width='28' height='41' rx='5' fill='%23F2EDE3'/><path fill='%23C42A34' transform='translate(36 32) scale(.26)' d='M0,34 C-14,20 -46,4 -46,-16 C-46,-34 -30,-42 -16,-36 C-8,-32 -2,-26 0,-20 C2,-26 8,-32 16,-36 C30,-42 46,-34 46,-16 C46,4 14,20 0,34 Z'/></g> </svg>">
<!-- Home-screen install.  iOS ignores the manifest's icons and uses
     apple-touch-icon, which must be a real PNG; Android uses the manifest.
     Both want a full-bleed square, so these are not the tab icon: the
     rounding is the operating system's to apply, not ours.  icons/icon.svg
     is the master art the PNGs are rendered from. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Oh Hell">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E1218">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;1,6..96,400&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#0E1218;
    --ground-2:#151B23;
    --card:#F2EDE3;
    --card-2:#E4DCCC;
    --ink:#12161C;
    --rouge:#C42A34;
    --gold:#C9A227;
    --steel:#7C8894;
    --line:rgba(242,237,227,.14);
    --display:"Bodoni Moda", Didot, "Times New Roman", serif;
    --body:"Karla", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--ground);
    color:var(--card);
    font-family:var(--body);
    font-size:16px;
    line-height:1.45;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 72px}

  /* ---------- masthead ---------- */
  .masthead{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;padding-bottom:14px;margin-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .masthead h1{
    font-family:var(--display);
    font-weight:700;font-size:clamp(30px,7vw,46px);
    line-height:.95;margin:0;letter-spacing:-.01em;
  }
  .masthead h1 em{font-style:italic;color:var(--rouge)}
  .masthead .sub{
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--steel);margin-top:8px;
  }
  .pips{font-size:22px;letter-spacing:.14em;white-space:nowrap;color:var(--steel)}
  .pips .r{color:var(--rouge)}

  /* ---------- generic bits ---------- */
  .eyebrow{
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--steel);margin:0 0 10px;
  }
  .panel{
    background:var(--ground-2);
    border:1px solid var(--line);
    border-radius:2px;
    padding:18px 16px;
    margin-bottom:18px;
  }
  .btn{
    font-family:var(--body);font-weight:700;font-size:14px;
    letter-spacing:.06em;text-transform:uppercase;
    background:var(--card);color:var(--ink);
    border:1px solid var(--card);border-radius:2px;
    padding:12px 18px;cursor:pointer;
  }
  .btn:hover{background:#fff}
  .btn[disabled]{opacity:.32;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--card);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--card);background:transparent}
  .btn.danger{background:transparent;color:var(--rouge);border-color:rgba(196,42,52,.5)}
  .btn.danger:hover{background:rgba(196,42,52,.12)}
  .btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,.hand-row:focus-visible{
    outline:2px solid var(--gold);outline-offset:2px;
  }
  input[type=text],select{
    font-family:var(--body);font-size:15px;
    background:#0B0F14;color:var(--card);
    border:1px solid var(--line);border-radius:2px;
    padding:10px 12px;width:100%;
  }
  label.field{display:block;margin-bottom:14px}
  label.field .lbl{
    display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--steel);margin-bottom:6px;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
  @media(max-width:520px){.row2{grid-template-columns:1fr}}

  /* ---------- setup ---------- */
  .counter{display:flex;align-items:center;gap:10px}
  .counter button{
    width:42px;height:42px;font-size:20px;line-height:1;
    background:transparent;color:var(--card);
    border:1px solid var(--line);border-radius:2px;cursor:pointer;
  }
  .counter button:hover{border-color:var(--card)}
  .counter .val{font-family:var(--display);font-size:26px;min-width:34px;text-align:center}
  .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:6px}
  .name-slot{display:flex;align-items:center;gap:8px}
  .name-slot .n{font-family:var(--display);font-size:15px;color:var(--steel);width:18px;text-align:right}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 20px}
  .check{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;cursor:pointer}
  .check input{margin-top:3px;accent-color:var(--rouge);width:16px;height:16px}
  .check .t{font-size:14px}
  .check .t small{display:block;color:var(--steel);font-size:12.5px;line-height:1.35}
  .pattern-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
  .pattern{
    border:1px solid var(--line);border-radius:2px;padding:10px 12px;cursor:pointer;
    background:transparent;text-align:left;color:var(--card);font-family:var(--body);
  }
  .pattern:hover{border-color:var(--steel)}
  .pattern.on{border-color:var(--rouge);background:rgba(196,42,52,.10)}
  .pattern.locked{opacity:.4;cursor:not-allowed}
  .pattern.locked:hover{border-color:var(--line)}
  .pattern .p-name{font-family:var(--display);font-size:19px;letter-spacing:.02em}
  .pattern .p-meta{font-size:12px;color:var(--steel)}

  /* ---------- hand header ---------- */
  .hand-head{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;
    padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid var(--line);
  }
  .hand-no{font-family:var(--display);font-size:34px;line-height:1}
  .hand-no small{font-size:14px;color:var(--steel);font-family:var(--body)}
  .hand-fact{font-size:13px;color:var(--steel)}
  .hand-fact b{color:var(--card);font-weight:500}
  .trump-pick{display:flex;gap:6px;margin-left:auto}
  .trump-pick button{
    width:38px;height:38px;font-size:19px;line-height:1;
    background:transparent;border:1px solid var(--line);border-radius:2px;
    color:var(--steel);cursor:pointer;
  }
  .trump-pick button.red{color:#9A5A5F}
  .trump-pick button.on{background:var(--card);border-color:var(--card);color:var(--ink)}
  .trump-pick button.on.red{color:var(--rouge)}

  /* ---------- bid / trick entry ---------- */
  .entry{display:grid;gap:2px}
  .p-line{padding:12px 0;border-bottom:1px solid rgba(242,237,227,.07)}
  .p-line:last-child{border-bottom:0}
  .p-top{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
  .p-name{font-size:16px;font-weight:700}
  .p-tag{
    font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    border:1px solid var(--line);padding:2px 6px;color:var(--steel);border-radius:2px;
  }
  .p-tag.deal{border-color:var(--gold);color:var(--gold)}
  .p-bidmark{margin-left:auto;font-size:13px;color:var(--steel)}
  .p-bidmark b{font-family:var(--display);font-size:18px;color:var(--card)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{
    min-width:42px;height:42px;padding:0 6px;
    font-family:var(--display);font-size:19px;
    background:transparent;color:var(--card);
    border:1px solid var(--line);border-radius:2px;cursor:pointer;
  }
  .chip:hover:not([disabled]){border-color:var(--steel)}
  .chip.on{background:var(--card);border-color:var(--card);color:var(--ink)}
  .chip[disabled]{opacity:.25;cursor:not-allowed;text-decoration:line-through}
  .chip.on.exact{background:var(--gold);border-color:var(--gold)}

  .tally{
    display:flex;flex-wrap:wrap;align-items:center;gap:12px;
    margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
  }
  .tally .read{font-size:13px;color:var(--steel)}
  .tally .read b{font-family:var(--display);font-size:17px;color:var(--card)}
  .tally .read.warn b,.tally .read.warn{color:var(--rouge)}
  .tally .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .hooknote{font-size:12.5px;color:var(--gold);margin-top:8px}
  .pressure{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    padding:3px 8px;border:1px solid var(--line);border-radius:2px;color:var(--steel);
  }
  .pressure.over{color:var(--rouge);border-color:rgba(196,42,52,.5)}
  .pressure.under{color:var(--gold);border-color:rgba(201,162,39,.5)}

  /* ---------- scorecard ---------- */
  .card-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.score{border-collapse:collapse;width:100%;min-width:min-content}
  table.score th,table.score td{border-bottom:1px solid rgba(242,237,227,.09);padding:0}
  table.score thead th{
    position:sticky;top:0;background:var(--ground-2);z-index:2;
    padding:10px 8px;text-align:center;font-size:12px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;
    border-bottom:1px solid var(--line);white-space:nowrap;
  }
  table.score thead th.corner{text-align:left;left:0;z-index:3}
  th.rowhead,td.cell{min-width:74px}
  th.rowhead{
    position:sticky;left:0;background:var(--ground-2);z-index:1;
    text-align:left;padding:8px 12px 8px 0;white-space:nowrap;
  }
  .rh-in{display:flex;align-items:baseline;gap:8px}
  .rh-cards{font-family:var(--display);font-size:20px;width:22px;text-align:right}
  .rh-suit{font-size:15px;color:var(--steel);width:14px}
  .rh-suit.red{color:var(--rouge)}
  .rh-deal{font-size:11px;color:var(--steel);letter-spacing:.06em;text-transform:uppercase}
  td.cell{padding:7px 6px;text-align:center;vertical-align:middle}
  .cell-in{display:inline-flex;flex-direction:column;align-items:center;gap:1px;
    padding:3px 8px;border-radius:2px;border:1px solid transparent;min-width:52px}
  .cell-in.made{border-color:rgba(201,162,39,.55);background:rgba(201,162,39,.09)}
  .bt{font-size:11.5px;color:var(--steel);letter-spacing:.04em}
  .cell-in.made .bt{color:var(--gold)}
  .cell-in.slam{background:var(--gold);border-color:var(--gold)}
  .cell-in.slam .bt{color:rgba(18,22,28,.72)}
  .cell-in.slam .tot{color:var(--ink);font-weight:700}
  .tot{font-family:var(--display);font-size:20px;line-height:1.1}
  tr.hand-row{cursor:pointer}
  tr.hand-row:hover th.rowhead,tr.hand-row:hover td.cell{background:rgba(242,237,227,.045)}
  tr.hand-row.editing th.rowhead,tr.hand-row.editing td.cell{background:rgba(196,42,52,.13)}
  tr.pending th.rowhead,tr.pending td.cell{opacity:.42}
  tfoot th,tfoot td{border-bottom:0;padding-top:12px}
  tfoot .final{font-family:var(--display);font-size:28px}
  tfoot .final.lead{color:var(--gold)}
  tfoot th.rowhead{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--steel)}
  .edit-hint{font-size:12.5px;color:var(--steel);margin-top:12px}

  /* ---------- standings / result ---------- */
  .standings{display:grid;gap:8px;margin-top:4px}
  .stand{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid rgba(242,237,227,.08)}
  .stand:last-child{border-bottom:0}
  .stand .rk{font-family:var(--display);font-size:15px;color:var(--steel);width:22px}
  .stand .nm{font-size:16px}
  .stand .made{font-size:12px;color:var(--steel);margin-left:auto}
  .stand .sc{font-family:var(--display);font-size:24px;min-width:58px;text-align:right}
  .stand.win .nm{font-weight:700}
  .stand.win .sc,.stand.win .rk{color:var(--gold)}
  .winner{font-family:var(--display);font-size:clamp(26px,6vw,40px);line-height:1.05;margin:0 0 6px}
  .winner em{font-style:italic;color:var(--gold)}

  .footnote{font-size:12.5px;color:var(--steel);text-align:center;margin-top:26px;line-height:1.6}
  .footnote span{color:rgba(124,136,148,.5);margin:0 6px}
  @media (prefers-reduced-motion: no-preference){
    .panel{animation:rise .28s ease both}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div>
      <h1>Oh <em>Hell</em></h1>
      <div class="sub">Bid it. Make it. Or don't.</div>
    </div>
    <div class="pips" aria-hidden="true">♠ <span class="r">♥</span> <span class="r">♦</span> ♣</div>
  </header>

  <main id="app"></main>

  <p class="footnote">
    Exact bid pays a bonus <span>·</span> tricks taken always count <span>·</span> the deal moves left each hand
  </p>
</div>

<script>
(function(){
  "use strict";

  var SUITS = [
    {k:"S", g:"♠", red:false, name:"Spades"},
    {k:"H", g:"♥", red:true,  name:"Hearts"},
    {k:"D", g:"♦", red:true,  name:"Diamonds"},
    {k:"C", g:"♣", red:false, name:"Clubs"}
  ];
  var PATTERNS = [
    {k:"down-up", label:"10 · 1 · 10", desc:"Down to one, back up"},
    {k:"up-down", label:"1 · 10 · 1", desc:"Up to ten, back down"},
    {k:"down",    label:"10 · 1",     desc:"Down to one, stop"},
    {k:"up",      label:"1 · 10",     desc:"Up to ten, stop"}
  ];

  var app = document.getElementById("app");
  var S = null;          // game state
  var editIndex = null;  // hand index being edited, else null
  var draft = null;      // {bids:[], tricks:[], trump:null, stage:'bid'|'tricks'}
  var pendingReset = null; // 'new' | 'redeal' | null

  /* ---------------- state ---------------- */

  function newSetup(){
    return {
      stage:"setup",
      names:["Player 1","Player 2","Player 3","Player 4"],
      opts:{pattern:"down-up", maxCards:10, hook:false, bonus:10, fail:"tricks", slam:true, decks:1},
      hands:[]
    };
  }

  function maxAllowed(n, decks){
    var d = decks || 1;
    return Math.max(1, Math.min(15, Math.floor((52 * d - 1) / n)));
  }

  function buildHands(names, opts){
    var m = opts.maxCards, seq = [], i;
    if(opts.pattern === "down-up"){
      for(i=m;i>=1;i--) seq.push(i);
      for(i=2;i<=m;i++) seq.push(i);
    } else if(opts.pattern === "up-down"){
      for(i=1;i<=m;i++) seq.push(i);
      for(i=m-1;i>=1;i--) seq.push(i);
    } else if(opts.pattern === "down"){
      for(i=m;i>=1;i--) seq.push(i);
    } else {
      for(i=1;i<=m;i++) seq.push(i);
    }
    return seq.map(function(c,idx){
      return {cards:c, dealer: idx % names.length, trump:null, bids:null, tricks:null};
    });
  }

  function firstOpenHand(){
    for(var i=0;i<S.hands.length;i++) if(S.hands[i].tricks === null) return i;
    return -1;
  }

  function madePays(h, p){
    // what an exactly-made bid is worth: normal scoring, or the slam rate if that's better
    var normal = h.tricks[p] + S.opts.bonus;
    if(S.opts.slam && h.bids[p] === h.cards) return Math.max(normal, h.cards * 10);
    return normal;
  }

  function slamPays(cards){
    return Math.max(cards + S.opts.bonus, cards * 10);
  }

  function handScore(h, p){
    if(!h || h.tricks === null) return null;
    var bid = h.bids[p], took = h.tricks[p];
    if(bid === took) return madePays(h, p);
    if(S.opts.fail === "zero") return 0;
    if(S.opts.fail === "diff") return -Math.abs(bid - took);
    return took;
  }

  function isSlam(h, p){
    return S.opts.slam && h.tricks !== null &&
           h.bids[p] === h.cards && h.tricks[p] === h.cards &&
           h.cards * 10 > h.cards + S.opts.bonus;
  }

  function totalsThrough(idx){
    var t = S.names.map(function(){return 0;});
    for(var i=0;i<=idx;i++){
      var h = S.hands[i];
      if(h.tricks === null) continue;
      for(var p=0;p<S.names.length;p++) t[p] += handScore(h,p);
    }
    return t;
  }

  function madeCount(p){
    var n=0;
    S.hands.forEach(function(h){ if(h.tricks !== null && h.bids[p] === h.tricks[p]) n++; });
    return n;
  }

  function gameOver(){ return S.hands.length > 0 && firstOpenHand() === -1; }

  /* ---------------- storage (optional) ---------------- */

  function save(){
    try{
      if(window.storage && window.storage.set){
        window.storage.set("ohhell:game", JSON.stringify(S)).catch(function(){});
      }
    }catch(e){}
  }
  function load(cb){
    try{
      if(window.storage && window.storage.get){
        window.storage.get("ohhell:game").then(function(r){
          if(r && r.value){ try{ cb(JSON.parse(r.value)); return; }catch(e){} }
          cb(null);
        }).catch(function(){ cb(null); });
        return;
      }
    }catch(e){}
    cb(null);
  }

  /* ---------------- helpers ---------------- */

  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(txt !== undefined && txt !== null) n.textContent = txt;
    return n;
  }
  function suitOf(k){
    for(var i=0;i<SUITS.length;i++) if(SUITS[i].k === k) return SUITS[i];
    return null;
  }
  function sum(a){ return a.reduce(function(x,y){ return x + (y===null?0:y); },0); }
  function allSet(a){ return a.every(function(v){ return v !== null; }); }

  /* ---------------- render ---------------- */

  function render(){
    app.innerHTML = "";
    if(S.stage === "setup"){ renderSetup(); return; }
    renderHandPanel();
    renderScorecard();
    if(gameOver()) renderResult();
  }

  /* ---------- setup ---------- */

  function renderSetup(){
    var p = el("div","panel");
    p.appendChild(el("p","eyebrow","At the table"));

    var c = el("div","counter");
    var minus = el("button",null,"−"); minus.setAttribute("aria-label","Remove a player");
    var val = el("div","val", String(S.names.length));
    var plus = el("button",null,"+"); plus.setAttribute("aria-label","Add a player");
    minus.onclick = function(){
      if(S.names.length <= 2) return;
      S.names.pop(); clampMax(); render();
    };
    plus.onclick = function(){
      if(S.names.length >= 12) return;
      S.names.push("Player " + (S.names.length+1)); clampMax(); render();
    };
    c.appendChild(minus); c.appendChild(val); c.appendChild(plus);
    c.appendChild(el("div","hand-fact", S.opts.decks === 2
      ? "players · up to 12 on two decks"
      : "players · up to 7 on one deck, 12 on two"));
    p.appendChild(c);

    var names = el("div","names");
    S.names.forEach(function(nm,i){
      var slot = el("div","name-slot");
      slot.appendChild(el("div","n", String(i+1)));
      var inp = document.createElement("input");
      inp.type = "text"; inp.value = nm; inp.maxLength = 18;
      inp.setAttribute("aria-label","Name of player " + (i+1));
      inp.oninput = function(){ S.names[i] = inp.value; };
      inp.onfocus = function(){ inp.select(); };
      slot.appendChild(inp);
      names.appendChild(slot);
    });
    p.appendChild(names);
    app.appendChild(p);

    // deal pattern
    var d = el("div","panel");
    d.appendChild(el("p","eyebrow","The deal"));
    var pg = el("div","pattern-grid");
    var m = S.opts.maxCards;
    PATTERNS.forEach(function(pat){
      var b = el("button","pattern" + (S.opts.pattern===pat.k?" on":""));
      b.type = "button";
      b.appendChild(el("div","p-name", pat.label.replace(/10/g, String(m))));
      b.appendChild(el("div","p-meta", pat.desc));
      b.onclick = function(){ S.opts.pattern = pat.k; render(); };
      pg.appendChild(b);
    });
    d.appendChild(pg);

    var mx = el("label","field");
    mx.appendChild(el("span","lbl","Most cards in a hand"));
    var mc = el("div","counter");
    var mmin = el("button",null,"−"); mmin.setAttribute("aria-label","Fewer cards");
    var mval = el("div","val", String(S.opts.maxCards));
    var mplus = el("button",null,"+"); mplus.setAttribute("aria-label","More cards");
    var cap = maxAllowed(S.names.length, S.opts.decks);
    mmin.onclick = function(){ if(S.opts.maxCards>1){ S.opts.maxCards--; render(); } };
    mplus.onclick = function(){ if(S.opts.maxCards<cap){ S.opts.maxCards++; render(); } };
    mc.appendChild(mmin); mc.appendChild(mval); mc.appendChild(mplus);
    var hands = buildHands(S.names, S.opts).length;
    mc.appendChild(el("div","hand-fact", hands + " hands · " + (S.opts.decks===2?"two decks":"one deck") +
      " deals up to " + cap + " each to " + S.names.length + " players"));
    mx.appendChild(mc);
    d.appendChild(mx);

    var deckField = el("label","field");
    deckField.appendChild(el("span","lbl","Cards in play"));
    var dg = el("div","pattern-grid");
    [1,2].forEach(function(nd){
      var locked = (nd === 2 && S.names.length < 6) || (nd === 1 && S.names.length > 7);
      var b = el("button","pattern" + (S.opts.decks===nd?" on":"") + (locked?" locked":""));
      b.type = "button";
      b.disabled = locked;
      b.appendChild(el("div","p-name", nd === 1 ? "One deck" : "Two decks"));
      b.appendChild(el("div","p-meta", nd === 1
        ? (locked ? "Not enough cards past 7 players"
                  : "52 cards · up to " + maxAllowed(S.names.length,1) + " each")
        : (locked ? "Needs 6 or more players"
                  : "104 cards · up to " + maxAllowed(S.names.length,2) + " each")));
      b.onclick = function(){
        S.opts.decks = nd;
        clampMax();
        render();
      };
      dg.appendChild(b);
    });
    deckField.appendChild(dg);
    if(S.opts.decks === 2){
      deckField.appendChild(el("div","hand-fact","Duplicate cards happen — the first one played wins the trick."));
    }
    d.appendChild(deckField);

    app.appendChild(d);

    // house rules
    var r = el("div","panel");
    r.appendChild(el("p","eyebrow","House rules"));
    var opts = el("div","opts");

    var hookLbl = el("label","check");
    var hookBox = document.createElement("input");
    hookBox.type = "checkbox"; hookBox.checked = S.opts.hook;
    hookBox.onchange = function(){ S.opts.hook = hookBox.checked; };
    var ht = el("div","t","Play the hook");
    ht.appendChild(el("small",null,"Off by default: anyone can bid anything, so the bids may total more or fewer tricks than are available. Turn it on to stop the dealer bidding the number that makes the bids add up exactly."));
    hookLbl.appendChild(hookBox); hookLbl.appendChild(ht);
    opts.appendChild(hookLbl);

    var slamLbl = el("label","check");
    var slamBox = document.createElement("input");
    slamBox.type = "checkbox"; slamBox.checked = !!S.opts.slam;
    slamBox.onchange = function(){ S.opts.slam = slamBox.checked; };
    var st2 = el("div","t","Bid the whole hand, take the whole hand");
    st2.appendChild(el("small",null,"Bid every trick in the hand and win them all and you score 10 per trick — 4 for 4 pays 40. Whichever is worth more, this or the usual bonus, is what you get, so 1 for 1 still pays " + (1 + S.opts.bonus) + "."));
    slamLbl.appendChild(slamBox); slamLbl.appendChild(st2);
    opts.appendChild(slamLbl);

    var bonusF = el("label","field");
    bonusF.appendChild(el("span","lbl","Bonus for an exact bid"));
    var bsel = document.createElement("select");
    [5,10,20].forEach(function(v){
      var o = document.createElement("option");
      o.value = String(v); o.textContent = v + " points";
      if(S.opts.bonus === v) o.selected = true;
      bsel.appendChild(o);
    });
    bsel.onchange = function(){ S.opts.bonus = parseInt(bsel.value,10); };
    bonusF.appendChild(bsel);
    opts.appendChild(bonusF);

    var failF = el("label","field");
    failF.appendChild(el("span","lbl","A missed bid scores"));
    var fsel = document.createElement("select");
    [["tricks","1 point per trick taken"],["zero","Nothing"],["diff","Minus 1 per trick off"]].forEach(function(pair){
      var o = document.createElement("option");
      o.value = pair[0]; o.textContent = pair[1];
      if(S.opts.fail === pair[0]) o.selected = true;
      fsel.appendChild(o);
    });
    fsel.onchange = function(){ S.opts.fail = fsel.value; };
    failF.appendChild(fsel);
    opts.appendChild(failF);

    r.appendChild(opts);

    var start = el("button","btn","Deal the first hand");
    start.onclick = function(){
      S.names = S.names.map(function(n,i){ return (n||"").trim() || ("Player " + (i+1)); });
      S.hands = buildHands(S.names, S.opts);
      S.stage = "play";
      editIndex = null; draft = null;
      save(); render(); window.scrollTo(0,0);
    };
    r.appendChild(start);
    app.appendChild(r);
  }

  function maxPlayers(){ return S.opts.decks === 2 ? 12 : 7; }

  function clampMax(){
    if(S.names.length < 6) S.opts.decks = 1;
    if(S.names.length > 7) S.opts.decks = 2;
    var cap = maxAllowed(S.names.length, S.opts.decks);
    if(S.opts.maxCards > cap) S.opts.maxCards = cap;
  }

  /* ---------- hand entry ---------- */

  function startDraft(idx){
    var h = S.hands[idx];
    draft = {
      trump: h.trump,
      bids: h.bids ? h.bids.slice() : S.names.map(function(){return null;}),
      tricks: h.tricks ? h.tricks.slice() : S.names.map(function(){return null;}),
      stage: (h.tricks !== null || (h.bids && allSet(h.bids))) ? "tricks" : "bid"
    };
  }

  function activeIndex(){
    if(editIndex !== null) return editIndex;
    return firstOpenHand();
  }

  function renderHandPanel(){
    var idx = activeIndex();
    if(idx < 0) return;                     // game finished, nothing open
    if(!draft) startDraft(idx);
    var h = S.hands[idx], n = S.names.length, cards = h.cards;

    var p = el("div","panel");

    // header
    var head = el("div","hand-head");
    var no = el("div","hand-no");
    no.appendChild(document.createTextNode(String(idx+1)));
    var small = el("small",null," of " + S.hands.length);
    no.appendChild(small);
    head.appendChild(no);
    var f1 = el("div","hand-fact");
    f1.appendChild(el("b",null, cards + (cards===1?" card":" cards")));
    f1.appendChild(document.createTextNode(" each"));
    head.appendChild(f1);
    var f2 = el("div","hand-fact");
    f2.appendChild(document.createTextNode("dealer "));
    f2.appendChild(el("b",null,S.names[h.dealer]));
    head.appendChild(f2);
    if(editIndex !== null) head.appendChild(el("div","p-tag","Editing"));

    var tp = el("div","trump-pick");
    tp.setAttribute("role","group");
    tp.setAttribute("aria-label","Turned-up trump suit");
    SUITS.forEach(function(s){
      var b = el("button", (s.red?"red":"") + (draft.trump===s.k?" on":""), s.g);
      b.type = "button"; b.title = "Trump: " + s.name;
      b.setAttribute("aria-label","Trump " + s.name);
      b.setAttribute("aria-pressed", draft.trump===s.k ? "true":"false");
      b.onclick = function(){ draft.trump = (draft.trump===s.k ? null : s.k); render(); };
      tp.appendChild(b);
    });
    head.appendChild(tp);
    p.appendChild(head);

    p.appendChild(el("p","eyebrow", draft.stage === "bid" ? "Bids" : "Tricks taken"));

    var list = el("div","entry");
    var order = [];
    for(var k=0;k<n;k++) order.push(k);

    order.forEach(function(pi){
      var line = el("div","p-line");
      var top = el("div","p-top");
      top.appendChild(el("div","p-name", S.names[pi]));
      if(pi === h.dealer) top.appendChild(el("div","p-tag deal","Dealer"));
      if(draft.stage === "bid" && pi === (h.dealer + 1) % n) top.appendChild(el("div","p-tag","Bids first"));
      if(draft.stage === "tricks"){
        var bm = el("div","p-bidmark");
        bm.appendChild(document.createTextNode("bid "));
        bm.appendChild(el("b",null,String(draft.bids[pi])));
        if(S.opts.slam && draft.bids[pi] === cards){
          bm.appendChild(document.createTextNode(" — all of them, "));
          bm.appendChild(el("b",null,String(slamPays(cards))));
          bm.appendChild(document.createTextNode(" if it lands"));
        }
        top.appendChild(bm);
      }
      line.appendChild(top);

      var chips = el("div","chips");
      var forbidden = hookForbidden(pi, h, cards);
      for(var v=0;v<=cards;v++){
        (function(v){
          var arr = draft.stage === "bid" ? draft.bids : draft.tricks;
          var on = arr[pi] === v;
          var exact = draft.stage === "tricks" && on && draft.bids[pi] === v;
          var b = el("button","chip" + (on?" on":"") + (exact?" exact":""), String(v));
          b.type = "button";
          b.setAttribute("aria-label", S.names[pi] + ": " + v);
          b.setAttribute("aria-pressed", on ? "true":"false");
          if(draft.stage === "bid" && forbidden === v){
            b.disabled = true;
            b.title = "The hook — the dealer can't bid " + v;
          }
          b.onclick = function(){
            arr[pi] = (arr[pi] === v ? null : v);
            render();
          };
          chips.appendChild(b);
        })(v);
      }
      line.appendChild(chips);
      if(draft.stage === "bid" && forbidden !== null){
        line.appendChild(el("div","hooknote","Hooked: " + forbidden + " would make the bids add up to " + cards + "."));
      }
      list.appendChild(line);
    });
    p.appendChild(list);

    // tally + actions
    var tally = el("div","tally");
    if(draft.stage === "bid"){
      var bidSum = sum(draft.bids);
      var done = allSet(draft.bids);
      var read = el("div","read");
      read.appendChild(document.createTextNode("Bid "));
      read.appendChild(el("b",null,String(bidSum)));
      read.appendChild(document.createTextNode(" of " + cards + " tricks"));
      tally.appendChild(read);
      if(done){
        var diff = bidSum - cards, cls = diff>0?"over":(diff<0?"under":"");
        var txt = diff>0 ? ("Table is " + diff + " over — somebody's going down")
                 : diff<0 ? ("Table is " + (-diff) + " under — a trick is going begging")
                 : "Bids are square";
        tally.appendChild(el("div","pressure " + cls, txt));
      }
      var acts = el("div","actions");
      if(editIndex !== null){
        var cancel = el("button","btn ghost","Cancel");
        cancel.onclick = function(){ editIndex = null; draft = null; render(); };
        acts.appendChild(cancel);
      }
      var lock = el("button","btn","Bids are in");
      lock.disabled = !done;
      lock.onclick = function(){
        S.hands[idx].bids = draft.bids.slice();
        S.hands[idx].trump = draft.trump;
        draft.stage = "tricks"; save(); render();
      };
      acts.appendChild(lock);
      tally.appendChild(acts);
    } else {
      var tSum = sum(draft.tricks);
      var tDone = allSet(draft.tricks) && tSum === cards;
      var read2 = el("div","read" + (allSet(draft.tricks) && tSum !== cards ? " warn":""));
      read2.appendChild(document.createTextNode("Counted "));
      read2.appendChild(el("b",null,String(tSum)));
      read2.appendChild(document.createTextNode(" of " + cards + " tricks"));
      tally.appendChild(read2);
      if(allSet(draft.tricks) && tSum !== cards){
        tally.appendChild(el("div","pressure over", tSum > cards ? "Too many — recount" : "Missing tricks — recount"));
      }
      var acts2 = el("div","actions");
      var back = el("button","btn ghost","Back to bids");
      back.onclick = function(){ draft.stage = "bid"; render(); };
      acts2.appendChild(back);
      if(editIndex !== null){
        var cancel2 = el("button","btn ghost","Cancel");
        cancel2.onclick = function(){ editIndex = null; draft = null; render(); };
        acts2.appendChild(cancel2);
      }
      var score = el("button","btn", editIndex !== null ? "Save hand" : "Score the hand");
      score.disabled = !tDone;
      score.onclick = function(){
        S.hands[idx].bids = draft.bids.slice();
        S.hands[idx].tricks = draft.tricks.slice();
        S.hands[idx].trump = draft.trump;
        editIndex = null; draft = null;
        save(); render();
        window.scrollTo(0,0);
      };
      acts2.appendChild(score);
      tally.appendChild(acts2);
    }
    p.appendChild(tally);
    app.appendChild(p);
  }

  function hookForbidden(pi, h, cards){
    if(!S.opts.hook) return null;
    if(pi !== h.dealer) return null;
    if(draft.stage !== "bid") return null;
    var others = 0;
    for(var i=0;i<S.names.length;i++){
      if(i === h.dealer) continue;
      if(draft.bids[i] === null) return null;   // not everyone has bid yet
      others += draft.bids[i];
    }
    var f = cards - others;
    return (f >= 0 && f <= cards) ? f : null;
  }

  /* ---------- scorecard ---------- */

  function renderScorecard(){
    var p = el("div","panel");
    p.appendChild(el("p","eyebrow","Scorepad"));

    var scroll = el("div","card-scroll");
    var t = el("table","score");

    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    var corner = el("th","corner rowhead","Hand");
    hr.appendChild(corner);

    var finals = totalsThrough(S.hands.length - 1);
    var colOrder = S.names.map(function(nm,i){ return i; });
    colOrder.sort(function(a,b){ return finals[b] - finals[a] || a - b; });

    colOrder.forEach(function(pi){ hr.appendChild(el("th",null,S.names[pi])); });
    thead.appendChild(hr);
    t.appendChild(thead);

    var tbody = document.createElement("tbody");
    var running = S.names.map(function(){return 0;});
    var act = activeIndex();

    S.hands.forEach(function(h,i){
      var played = h.tricks !== null;
      var tr = el("tr","hand-row" + (played?"":" pending") + (editIndex===i?" editing":""));
      tr.tabIndex = 0;
      var s = h.trump ? suitOf(h.trump) : null;

      var rh = el("th","rowhead");
      var rhIn = el("div","rh-in");
      rhIn.appendChild(el("div","rh-cards", String(h.cards)));
      rhIn.appendChild(el("div","rh-suit" + (s && s.red ? " red":""), s ? s.g : "·"));
      rhIn.appendChild(el("div","rh-deal", S.names[h.dealer].slice(0,8) + " deals"));
      rh.appendChild(rhIn);
      tr.appendChild(rh);

      colOrder.forEach(function(pi){
        var td = el("td","cell");
        if(played){
          running[pi] += handScore(h,pi);
          var made = h.bids[pi] === h.tricks[pi];
          var slam = isSlam(h,pi);
          var inn = el("div","cell-in" + (made?" made":"") + (slam?" slam":""));
          inn.appendChild(el("div","bt", h.bids[pi] + " · " + h.tricks[pi]));
          inn.appendChild(el("div","tot", String(running[pi])));
          td.appendChild(inn);
        } else {
          var inn2 = el("div","cell-in");
          inn2.appendChild(el("div","bt", h.bids ? (h.bids[pi] + " · —") : "—"));
          inn2.appendChild(el("div","tot","·"));
          td.appendChild(inn2);
        }
        tr.appendChild(td);
      });

      function open(){
        if(i === act && editIndex === null) return;   // already the live hand
        editIndex = i; draft = null; render();
        window.scrollTo(0,0);
      }
      tr.onclick = open;
      tr.onkeydown = function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(); } };
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);

    var tfoot = document.createElement("tfoot");
    var fr = document.createElement("tr");
    fr.appendChild(el("th","rowhead","Total"));
    var best = Math.max.apply(null, running);
    colOrder.forEach(function(pi){
      var v = running[pi];
      var td = el("td","cell");
      td.appendChild(el("div","final" + (v===best && best!==0 ? " lead":""), String(v)));
      fr.appendChild(td);
    });
    tfoot.appendChild(fr);
    t.appendChild(tfoot);

    scroll.appendChild(t);
    p.appendChild(scroll);
    p.appendChild(el("p","edit-hint","Columns run highest score to lowest, so the leader sits on the left. Each cell reads bid · taken, then the running total. Gold means the bid was made. Tap any row to fix it."));

    var acts = el("div","tally");
    var wrapA = el("div","actions");

    if(pendingReset === "redeal"){
      acts.appendChild(el("div","read warn","Wipe every score and start these players over?"));
      var keep1 = el("button","btn ghost","Keep playing");
      keep1.onclick = function(){ pendingReset = null; render(); };
      var yes1 = el("button","btn danger","Yes, redeal");
      yes1.onclick = function(){
        S.hands = buildHands(S.names, S.opts);
        editIndex = null; draft = null; pendingReset = null;
        save(); render(); window.scrollTo(0,0);
      };
      wrapA.appendChild(keep1); wrapA.appendChild(yes1);
    } else if(pendingReset === "new"){
      acts.appendChild(el("div","read warn","Clear this scorepad and set up a new game?"));
      var keep2 = el("button","btn ghost","Keep playing");
      keep2.onclick = function(){ pendingReset = null; render(); };
      var yes2 = el("button","btn danger","Yes, start over");
      yes2.onclick = function(){
        S.stage = "setup";
        S.hands = [];
        editIndex = null; draft = null; pendingReset = null;
        clampMax();
        save(); render(); window.scrollTo(0,0);
      };
      wrapA.appendChild(keep2); wrapA.appendChild(yes2);
    } else {
      var re = el("button","btn ghost","Same players, redeal");
      re.onclick = function(){ pendingReset = "redeal"; render(); };
      var nu = el("button","btn danger","New game");
      nu.onclick = function(){ pendingReset = "new"; render(); };
      wrapA.appendChild(re); wrapA.appendChild(nu);
    }

    acts.appendChild(wrapA);
    p.appendChild(acts);

    app.appendChild(p);
  }

  /* ---------- result ---------- */

  function renderResult(){
    var totals = totalsThrough(S.hands.length-1);
    var order = S.names.map(function(nm,i){ return {nm:nm, sc:totals[i], made:madeCount(i)}; });
    order.sort(function(a,b){ return b.sc - a.sc || b.made - a.made; });
    var top = order[0].sc;
    var winners = order.filter(function(o){ return o.sc === top; });

    var p = el("div","panel");
    p.appendChild(el("p","eyebrow","That's the last hand"));
    var w = el("h2","winner");
    if(winners.length === 1){
      w.appendChild(el("em",null,winners[0].nm));
      w.appendChild(document.createTextNode(" takes it, " + top + " points."));
    } else {
      w.appendChild(document.createTextNode("Dead heat at " + top + " — "));
      w.appendChild(el("em",null,winners.map(function(o){return o.nm;}).join(" and ")));
    }
    p.appendChild(w);

    var st = el("div","standings");
    order.forEach(function(o,i){
      var row = el("div","stand" + (o.sc===top?" win":""));
      row.appendChild(el("div","rk", String(i+1)));
      row.appendChild(el("div","nm", o.nm));
      row.appendChild(el("div","made", o.made + " of " + S.hands.length + " bids made"));
      row.appendChild(el("div","sc", String(o.sc)));
      st.appendChild(row);
    });
    p.appendChild(st);
    app.appendChild(p);
  }

  /* ---------------- boot ---------------- */

  load(function(saved){
    if(saved && saved.names && saved.hands){
      S = saved;
      if(!S.opts) S.opts = newSetup().opts;
      if(S.opts.slam === undefined) S.opts.slam = true;
      if(S.opts.decks === undefined) S.opts.decks = 1;
    } else {
      S = newSetup();
    }
    render();
  });
})();
</script>
</body>
</html>
