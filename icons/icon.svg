<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Master art for icons/*.png.  Full-bleed square: the rounding is the
       operating system's to apply, not ours.

       Five cards spread as a hand, the middle one lowest — the hand sizes
       ramp 10 down to 1 and back up, which is the shape of a game of Oh
       Hell.  Horns on the middle card for the name.  Palette is the
       scorepad's own (--ground, --card, --card-2, --rouge).

       The tab favicon is a separate, simpler drawing inlined in index.html:
       four suit pips and a pair of horns do not survive 16px. -->
  <defs>
    <path id="spade" d="M0,-38 C-6,-22 -34,-8 -34,10 C-34,24 -22,30 -12,26 C-8,24 -5,21 -4,18
                        C-4,26 -8,34 -14,38 L14,38 C8,34 4,26 4,18 C5,21 8,24 12,26
                        C22,30 34,24 34,10 C34,-8 6,-22 0,-38 Z"/>
    <path id="heart" d="M0,32 C-13,19 -42,4 -42,-15 C-42,-32 -27,-39 -15,-33 C-7,-29 -2,-24 0,-18
                        C2,-24 7,-29 15,-33 C27,-39 42,-32 42,-15 C42,4 13,19 0,32 Z"/>
    <path id="diamond" d="M0,-40 C10,-18 20,-6 28,0 C20,6 10,18 0,40 C-10,18 -20,6 -28,0 C-20,-6 -10,-18 0,-40 Z"/>
    <g id="club">
      <circle cx="0" cy="-20" r="15"/><circle cx="-19" cy="7" r="15"/><circle cx="19" cy="7" r="15"/>
      <path d="M-11,38 C-4,28 -3,15 0,4 C3,15 4,28 11,38 Z"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="#0E1218"/>

  <!-- The whole hand is scaled in so it clears the circle Android may
       crop a maskable icon to; at full size the outer cards lost their
       tops. -->
  <g transform="translate(256 262) scale(.87) translate(-256 -262)">

  <!-- the spread hand, drawn outward-in so the middle card lands on top -->
  <g stroke="#0E1218" stroke-width="9">
    <g transform="rotate(-13 132 410)"><rect x="62"  y="130" width="140" height="198" rx="14" fill="#F2EDE3"/></g>
    <g transform="rotate(13 380 410)"><rect x="310" y="130" width="140" height="198" rx="14" fill="#F2EDE3"/></g>
    <g transform="rotate(-6 194 410)"><rect x="124" y="170" width="140" height="198" rx="14" fill="#E4DCCC"/></g>
    <g transform="rotate(6 318 410)"><rect x="248" y="170" width="140" height="198" rx="14" fill="#E4DCCC"/></g>
  </g>

  <!-- horns first, so they rise from behind the middle card's top edge -->
  <g fill="#C42A34">
    <path d="M194,226 C172,208 156,182 150,144 C172,158 198,182 218,206 C224,214 230,220 238,226 Z"/>
    <path d="M318,226 C340,208 356,182 362,144 C340,158 314,182 294,206 C288,214 282,220 274,226 Z"/>
  </g>

  <rect x="186" y="212" width="140" height="198" rx="14" fill="#C42A34" stroke="#0E1218" stroke-width="9"/>

  <g fill="#F2EDE3">
    <g transform="translate(224 290) scale(.42)"><use href="#spade"/></g>
    <g transform="translate(288 290) scale(.42)"><use href="#heart"/></g>
    <g transform="translate(224 350) scale(.42)"><use href="#diamond"/></g>
    <g transform="translate(288 350) scale(.42)"><use href="#club"/></g>
  </g>
  </g>
</svg>
